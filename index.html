<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My School – School No. 84, Minsk</title>
<meta name="description" content="My school project: School No. 84 named after P. T. Ponomarev, Minsk. History, school day, rules and traditions.">
<meta property="og:title" content="My School – School No. 84, Minsk">
<meta property="og:description" content="An interactive project about our school.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%AB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0e0f11; --ink:#f1efe9; --mute:#9a9994; --line:rgba(255,255,255,.12);
  --card:rgba(255,255,255,.045); --accent:#e3d2ae; --ok:#8fae9a;
  --win:rgba(24,25,29,.88); --chip:rgba(14,15,17,.6); --dot:rgba(255,255,255,.07); --onacc:#16130d;
  --sh:0 0 0 transparent; --wsh:0 30px 80px rgba(0,0,0,.4); --glow:color-mix(in srgb,var(--accent) 30%,transparent); --tr:radial-gradient(circle at 50% 38%,#2b2519 0,#0a0a0c 72%);
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#f6f3ed; --ink:#1a1814; --mute:#6b665d; --line:rgba(40,30,20,.12);
  --card:rgba(255,255,255,.78); --accent:#a05a20; --ok:#4f8a6a;
  --win:rgba(255,255,255,.94); --chip:rgba(255,255,255,.8); --dot:rgba(60,40,20,.08); --onacc:#fff;
  --sh:0 10px 30px -14px rgba(70,45,20,.28); --wsh:0 30px 80px -10px rgba(70,45,20,.28); --glow:transparent;
  --tr:radial-gradient(circle at 50% 38%,#fffaf0 0,#efe6d6 75%);
}
:root[data-theme=light] body{background:radial-gradient(900px circle at 12% 8%,#ffe6d0 0,transparent 60%),radial-gradient(900px circle at 92% 88%,#dfe4ff 0,transparent 60%),#f6f3ed}
:root[data-theme=light] .rays{opacity:.6}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--sans);overflow:hidden;transition:background .6s,color .6s}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(620px circle at var(--sx,50%) var(--sy,40%),color-mix(in srgb,var(--accent) 17%,transparent),transparent 70%),
  radial-gradient(var(--dot) 1px,transparent 1px) 0 0/28px 28px}
.rays{position:fixed;left:50%;top:50%;width:150vmax;height:150vmax;translate:-50% -50%;pointer-events:none;z-index:0;
  background:conic-gradient(transparent 0 6%,color-mix(in srgb,var(--accent) 16%,transparent) 11%,transparent 17% 38%,color-mix(in srgb,var(--accent) 12%,transparent) 44%,transparent 50% 72%,color-mix(in srgb,var(--accent) 14%,transparent) 78%,transparent 85%);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 50%);mask:radial-gradient(circle,#000 0,transparent 50%);animation:spin 90s linear infinite}
@keyframes spin{to{rotate:360deg}}
.dust{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.dust i{position:absolute;bottom:-10px;border-radius:50%;background:var(--accent);opacity:0;animation:up2 linear infinite}
@keyframes up2{10%{opacity:.7}90%{opacity:.5}100%{transform:translate(var(--dx),-108vh);opacity:0}}
.bgp{position:fixed;inset:0;z-index:0;pointer-events:none}
.bgp img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) blur(3px);opacity:.1}

/* intro */
.intro{position:fixed;inset:0;z-index:100;background:#050506;display:grid;place-items:center;color:#f3efe6;transition:opacity 1.1s,filter 1.1s,transform 1.3s}
.intro.out{opacity:0;filter:blur(18px);transform:scale(1.3);pointer-events:none}
.beam{position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,#efe3c8,transparent);box-shadow:0 0 24px 2px rgba(239,227,200,.6);transform:scaleX(0);animation:beam 1.5s .2s cubic-bezier(.7,0,.2,1) forwards}
@keyframes beam{60%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
.bloom{position:absolute;width:70vmax;height:70vmax;border-radius:50%;background:radial-gradient(circle,rgba(239,227,200,.4),transparent 60%);opacity:0;scale:.2;animation:bloom 1.8s 2s ease-out forwards}
@keyframes bloom{35%{opacity:1}100%{opacity:0;scale:1.3}}
.iw{display:flex;font:400 clamp(140px,28vw,340px)/.8 var(--serif);letter-spacing:-.05em}
.iw span{opacity:0;filter:blur(26px)}
.iw span:first-child{animation:in8 1.3s 1s cubic-bezier(.2,.8,.2,1) forwards}
.iw span:last-child{animation:in4 1.3s 1.25s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in8{from{transform:translateX(-90px)}to{opacity:1;filter:none}}
@keyframes in4{from{transform:translateX(90px)}to{opacity:1;filter:none}}
.it{position:absolute;bottom:17vh;font:italic 22px var(--serif);color:#a9a69d;opacity:0;animation:fade 1.2s 2.2s forwards}
.skip{position:absolute;right:24px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:none;border:0;color:#77756e;font-size:13px}
.pre .scene,.pre .top,.pre .tl{display:none}

.top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:3;display:flex;justify-content:space-between;align-items:center;padding:20px 28px;pointer-events:none}
.brand{font:italic 22px var(--serif);color:var(--mute)}
.rt{display:flex;gap:8px;align-items:center}
.sbtn,.chip{pointer-events:auto;border:1px solid var(--line);background:var(--chip);backdrop-filter:blur(8px);border-radius:99px;padding:7px 14px;font-size:13px;color:var(--mute);transition:.25s}
.sbtn:hover{color:var(--ink);border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
kbd{font:12px var(--sans);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-left:6px}
.chip{display:flex;align-items:center;gap:10px;pointer-events:none}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%,100%{box-shadow:0 0 0 9px transparent}}

.scene{position:relative;z-index:1;height:100%;overflow:hidden}
.core{position:absolute;left:50%;top:50%;translate:-50% -50%;text-align:center;pointer-events:none;width:min(420px,60vw);transform:translate(calc(var(--mx,0)*10px),calc(var(--my,0)*8px))}
.core h1{font:400 clamp(130px,21vw,270px)/.8 var(--serif);letter-spacing:-.05em;margin:0 0 22px;position:relative;pointer-events:auto;cursor:pointer;transition:color .4s,text-shadow .4s;text-shadow:0 0 70px var(--glow);animation:rise 1.5s cubic-bezier(.2,.8,.2,1) both}
.core h1:hover{color:var(--accent)}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(1.1);filter:blur(16px)}}
.core p{margin:0;color:var(--mute);font-size:14px;animation:fade 1.4s .7s both}
.core p+p{margin-top:6px;color:var(--accent)}
@keyframes fade{from{opacity:0}}
.dial{position:absolute;left:50%;top:50%;width:min(400px,58vmin);height:auto;translate:-50% -50%;overflow:visible;transition:opacity 1s;animation:fade 2.2s .4s both}
.dial .l{fill:none;stroke:var(--mute);opacity:.55;stroke-width:3;stroke-linecap:round}
.dial .a{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 5px var(--accent))}
.dial circle.a{fill:var(--accent)}

.ring{position:absolute;inset:0;transform:translate(calc(var(--mx,0)*-16px),calc(var(--my,0)*-12px))}
.item{position:absolute;left:var(--x);top:var(--y);translate:-50% -50%;animation:fly 1.2s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.5s + var(--i)*.09s)}
@keyframes fly{from{opacity:0;scale:.3;left:50%;top:50%}}
.c{display:block;width:172px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 18px;backdrop-filter:blur(6px);
  animation:float 7s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-1.7s);transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));box-shadow:var(--sh);transition:transform .2s,border-color .35s,opacity .35s,box-shadow .35s}
@keyframes float{to{translate:0 -7px}}
.c:hover,.c:focus-visible{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.06);border-color:color-mix(in srgb,var(--accent) 60%,transparent);
  background-image:radial-gradient(170px circle at var(--px,50%) var(--py,50%),color-mix(in srgb,var(--accent) 24%,transparent),transparent 70%);box-shadow:0 12px 40px -12px color-mix(in srgb,var(--accent) 50%,transparent)}
.c b{display:block;font:400 22px/1.1 var(--serif)}
.c span{display:block;color:var(--mute);font-size:13px;margin-top:4px}
.c.open{opacity:.35}

.w{position:fixed;z-index:20;width:min(560px,92vw);max-height:78vh;display:flex;flex-direction:column;background:var(--win);backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--wsh)}
.tb{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 12px;border-bottom:1px solid var(--line);cursor:grab;touch-action:none;user-select:none}
.tb span{font:400 21px var(--serif)}
.x{border:0;background:transparent;font-size:24px;line-height:1;color:var(--mute);width:30px;height:30px;border-radius:50%;transition:.25s}
.x:hover{background:var(--line);color:var(--ink)}
.bd{padding:18px 22px 24px;overflow-y:auto}
.bd>*{animation:up .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.2s + var(--k,0)*.06s)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.bd p{margin:0 0 12px}.m{color:var(--mute)}
.bd h4{font:400 20px var(--serif);margin:16px 0 6px;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.yr{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 14px;font-size:13px;color:var(--mute);transition:.25s}
.yr:hover{color:var(--ink)}.yr[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
.story h3{font:400 34px/1.1 var(--serif);margin:0 0 8px}
.story.sw{animation:swap .45s ease}
@keyframes swap{from{opacity:0;transform:translateX(14px)}}
.big{font:400 52px/1 var(--serif);color:var(--accent)}
.sched{display:grid;gap:4px;margin-top:14px}
.row{display:flex;gap:14px;padding:8px 12px;border-radius:10px;transition:.3s}
.row b{font:400 20px var(--serif);width:20px;color:var(--accent)}.row span{flex:1}.row em{font-style:normal;color:var(--mute)}
.row.brk{padding:0 12px;font-size:12px;color:var(--mute);opacity:.7}
.row.cur{background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
.bar2{height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:10px}
.bar2 i{display:block;height:100%;width:0;background:var(--accent);transition:width 1s}
.now{font:400 24px/1.2 var(--serif)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:4/3;border:1px dashed var(--line);border-radius:10px;overflow:hidden;display:grid;place-items:center;font-size:12px;color:var(--mute)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:zoom-in}
blockquote{margin:0;padding-left:16px;border-left:2px solid var(--accent);font:italic 22px/1.4 var(--serif)}
blockquote small{display:block;font:13px var(--sans);color:var(--mute);margin-top:8px}
.rel{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
.rel button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 12px;margin-left:6px;font-size:13px;transition:.25s}
.rel button:hover{border-color:var(--accent);color:var(--accent)}
.lb{position:fixed;inset:0;z-index:60;background:rgba(6,6,8,.92);display:none;place-items:center;padding:20px;cursor:zoom-out}
.lb.on{display:grid}.lb img{max-width:100%;max-height:100%;border-radius:12px}
.sp{position:fixed;inset:0;z-index:70;background:rgba(8,8,10,.55);backdrop-filter:blur(8px);display:none;justify-items:center;align-content:start;padding-top:16vh}
.sp.on{display:grid;animation:fade .25s}
.spb{width:min(580px,92vw);background:var(--win);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.4);overflow:hidden}
.spb input{width:100%;border:0;background:transparent;color:var(--ink);font:400 24px var(--serif);padding:20px 24px;outline:0}
.spb ul{list-style:none;margin:0;padding:0}
.spb li button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 24px}
.spb li.on button,.spb li button:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.spb li b{font:400 19px var(--serif);display:block}.spb li span{color:var(--mute);font-size:13px}
.tl{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 0;width:min(560px,70vw);display:flex;justify-content:space-between;z-index:2;animation:fade 2s .9s both}
.tl::before{content:"";position:absolute;left:0;right:0;top:4px;height:1px;background:var(--line)}
.tl button{position:relative;border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--mute);font-size:11px}
.tl i{width:9px;height:9px;border-radius:50%;background:var(--bg);border:1px solid var(--mute);transition:.3s}
.tl button:hover{color:var(--accent)}.tl button:hover i{background:var(--accent);border-color:var(--accent);transform:scale(1.5)}

.c.star{position:relative;border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.c.star::after{content:"✦";position:absolute;top:10px;right:14px;color:var(--accent);animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.3;scale:.6}}
.vb{display:flex;align-items:center;gap:12px;margin:0 0 10px;font-size:13px;color:var(--mute)}
.vb span{width:84px}.vb div{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.vb i{display:block;height:100%;width:0;background:var(--accent);box-shadow:0 0 10px var(--accent);transition:width 1.5s cubic-bezier(.2,.8,.2,1)}
.thx{margin-top:6px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:99px;padding:8px 22px;font:400 19px var(--serif);transition:.3s}
.thx:hover{background:var(--accent);color:var(--onacc)}
.spark{position:fixed;z-index:90;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);pointer-events:none}
.tr{position:fixed;inset:0;z-index:80;background:var(--tr);display:grid;place-items:center;overflow:auto;transition:opacity .5s}
.tr.off{opacity:0;pointer-events:none}
.trg{position:absolute;inset:0;background:conic-gradient(from 0deg at 50% 38%,transparent 0 8%,color-mix(in srgb,var(--accent) 16%,transparent) 12%,transparent 18% 40%,color-mix(in srgb,var(--accent) 12%,transparent) 46%,transparent 52% 75%,color-mix(in srgb,var(--accent) 14%,transparent) 80%,transparent 86%);-webkit-mask:radial-gradient(circle at 50% 38%,#000,transparent 65%);mask:radial-gradient(circle at 50% 38%,#000,transparent 65%);animation:spin 70s linear infinite;pointer-events:none}
.trs{position:absolute;inset:0;pointer-events:none}
.trs i{position:absolute;border-radius:50%;background:var(--accent);animation:tw2 3s ease-in-out infinite}
@keyframes tw2{0%,100%{opacity:.12;scale:.6}50%{opacity:.9;scale:1.3}}
.trx{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));right:22px;z-index:2;width:40px;height:40px;border:1px solid var(--line);background:var(--chip);border-radius:50%;font-size:22px;line-height:1;color:var(--mute);transition:.25s}
.trx:hover{color:var(--ink);border-color:var(--accent)}
.trc{position:relative;display:grid;grid-template-columns:auto minmax(0,640px);gap:clamp(30px,6vw,90px);align-items:center;padding:60px 28px;max-width:1100px}
.trp{position:relative;width:min(380px,40vw);height:min(480px,60vh)}
.pol{position:absolute;margin:0;width:54%;aspect-ratio:3/3.7;background:#fff;padding:8px 8px 30px;border-radius:4px;box-shadow:0 20px 50px rgba(30,20,10,.38);animation:pin 1.4s cubic-bezier(.2,.8,.2,1) both,bob 6s ease-in-out infinite alternate}
.pol img{width:100%;height:100%;object-fit:cover;display:block;border-radius:2px}
.pol b{display:none;position:absolute;left:8px;right:8px;top:8px;bottom:30px;place-items:center;font:400 90px var(--serif);color:#a05a20;background:linear-gradient(135deg,#f3dfc4,#fff)}
.pol.empty b{display:grid}
.p1{left:0;top:0;rotate:-7deg;animation-delay:1s,0s}
.p3{left:6%;bottom:0;rotate:-3deg;animation-delay:1.6s,-5s}
.pol figcaption{position:absolute;left:0;right:0;bottom:7px;text-align:center;font:italic 15px var(--serif);color:#5a4d3b}
.p2{right:0;top:26%;rotate:5deg;animation-delay:1.3s,-3s}
.p2.empty{display:none}
@keyframes pin{from{opacity:0;transform:translateY(60px) scale(.8)}}
@keyframes bob{to{translate:0 -8px}}
.trt .k{color:var(--accent);margin:0 0 4px;font-size:14px;animation:up 1s 1s both}
.nm{font:400 clamp(34px,4.6vw,68px)/1.05 var(--serif);margin:0 0 22px;letter-spacing:-.02em;white-space:nowrap}
.nm span{display:inline-block;animation:ltr 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(1.2s + var(--d))}
@keyframes ltr{from{opacity:0;transform:translateY(30px);filter:blur(12px)}}
.ln{font:400 21px/1.5 var(--serif);margin:0 0 12px;animation:up 1s both;animation-delay:var(--d)}
.sg{color:var(--mute);font-style:italic;margin:18px 0;animation:up 1s both;animation-delay:var(--d)}
.tb2{animation:up 1s both;animation-delay:var(--d)}
@media (max-width:820px){.trc{grid-template-columns:1fr;padding-top:70px}.trp{width:100%;height:250px}.pol{width:40%}.p3{display:none}.rt{flex-wrap:wrap;justify-content:center}}
@media (max-width:900px),(max-height:560px){
  body{overflow:auto}
  .scene{height:auto;min-height:100%;overflow:visible;padding:96px 18px 70px}
  .core{position:relative;left:auto;top:auto;translate:none;transform:none;width:auto;margin:30px 0 44px}
  .dial{width:320px}
  .core h1{font-size:150px}
  .ring{position:static;transform:none;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:520px;margin:0 auto}
  .item{position:static;translate:none;animation:fade .8s both;animation-delay:calc(.3s + var(--i)*.06s)}
  .c{width:100%}
  .top{padding:14px 12px;justify-content:center}.brand,.tl,.sbtn kbd,#fs{display:none}
  .w{left:0!important;right:0;top:auto!important;bottom:0;width:100%;max-height:85vh;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  var T=[
  {id:'history',init:histWin,
   en:{t:'History',s:'Since 1937',b:'<div class="chips" data-yrs></div><div class="story" data-story></div>'+hp('People','A general, doctors of physics and mathematics, a TV presenter and an actress studied here. Many graduates came back to teach in their own school.')},
   ru:{t:'История',s:'С 1937 года',b:'<div class="chips" data-yrs></div><div class="story" data-story></div>'+hp('Люди','Здесь учились генерал, доктора физики и математики, телеведущий и актриса. Многие выпускники вернулись работать учителями в родную школу.')}},
  {id:'name',
   en:{t:'Our name',s:'P. T. Ponomarev',b:'<p>Pyotr Ponomarev was born in 1924 near Saratov. He served as a gunner in the Red Army.</p><p class="m">On 26 October 1943, near the village of Rabovichi in Belarus, he kept fighting even though he was wounded. In two days of battle he destroyed 4 tanks, 2 armoured carriers and over 200 enemy soldiers. He died in that fight.</p><p class="m">Our school carries his name.</p>'},
   ru:{t:'Наше имя',s:'П. Т. Пономарёв',b:'<p>Пётр Пономарёв родился в 1924 году под Саратовом. Служил наводчиком орудия в Красной Армии.</p><p class="m">26 октября 1943 года у деревни Рабовичи в Беларуси он продолжал бой, будучи раненым. За два дня боёв он уничтожил 4 танка, 2 бронетранспортёра и более 200 солдат противника. Он погиб в этом бою.</p><p class="m">Наша школа носит его имя.</p>'}},
  {id:'offers',
   en:{t:'What we offer',s:'Maths, English, results',b:hs([['Advanced maths','Classes with a deeper study of mathematics have existed here since 1989.'],['English','An amazing English teacher and lessons that students really like.'],['Olympiads','Our students regularly win prizes at district and city olympiads.'],['School museum','Old documents, newspapers and photos from the history of the school.'],['Two buildings, one school','The junior and the senior school are connected.']])},
   ru:{t:'Что мы предлагаем',s:'Математика, английский',b:hs([['Углублённая математика','Классы с углублённым изучением математики есть с 1989 года.'],['Английский','Классная учительница английского и уроки, которые нравятся ученикам.'],['Олимпиады','Наши ученики регулярно занимают призовые места на районных и городских олимпиадах.'],['Школьный музей','Старые документы, газеты и фотографии из истории школы.'],['Два здания, одна школа','Младшая и старшая школы соединены.']])}},
  {id:'day',init:sched,
   en:{t:'School day',s:'8:30 – 15:05',b:'<div class="now" data-now>…</div><div class="bar2"><i data-bar></i></div><div class="sched" data-sched></div><p class="m" style="margin-top:12px;font-size:13px">Lessons are 45 minutes. Breaks are 15 minutes, after lessons 5 and 6 they are 10. Minsk time.</p>'},
   ru:{t:'Школьный день',s:'8:30 – 15:05',b:'<div class="now" data-now>…</div><div class="bar2"><i data-bar></i></div><div class="sched" data-sched></div><p class="m" style="margin-top:12px;font-size:13px">Урок длится 45 минут. Перемены по 15 минут, после 5 и 6 уроков по 10. Время минское.</p>'}},
  {id:'rules',
   en:{t:'Rules',s:'Dress code, phones',b:hs([['Business dress code','We come to school in a neat business style.'],['Phones are handed in','Before lessons students hand in their phones and get them back after.'],['Respect','We respect teachers, classmates and our school.']])},
   ru:{t:'Правила',s:'Форма, телефоны',b:hs([['Деловой стиль одежды','Мы приходим в школу в аккуратной деловой одежде.'],['Телефоны сдаём','Перед уроками ученики сдают телефоны и забирают их после занятий.'],['Уважение','Мы уважаем учителей, одноклассников и свою школу.']])}},
  {id:'clubs',
   en:{t:'Clubs & events',s:'Beyond lessons',b:hs([['Assembly lines','Festive assemblies open the school year and mark important days.'],['Teacher’s Day','Students prepare concerts and greetings for their teachers.'],['Tourism and sport','In the past our team was the best in republic tourism competitions, and students took first places in city auto contests.']])},
   ru:{t:'Кружки и события',s:'Не только уроки',b:hs([['Линейки','Торжественные линейки открывают учебный год и отмечают важные даты.'],['День учителя','Ученики готовят концерты и поздравления для учителей.'],['Туризм и спорт','Раньше наша команда была лучшей на республиканских соревнованиях по туризму, а ученики занимали первые места на городских конкурсах по автоделу.']])}},
  {id:'traditions',
   en:{t:'Traditions',s:'9 May and more',b:hs([['9 May','Students, teachers and soldiers lay flowers at the Tomb of the Unknown Soldier. In 1964 the leader of Belarus, Pyotr Masherov, saw it, stopped his motorcade and talked to the people there. The photos are in our museum.'],['Graduates return','Many former students come back to work in the school where they studied.'],['Sharing success','Our teachers often become directors of other schools in the district.']])},

    if(done)return;done=1;intro.classList.add('out');document.body.classList.remove('pre');
    setTimeout(function(){intro.remove()},1400);
    var h=location.hash.slice(1);if(byId[h])setTimeout(function(){openWin(byId[h],byId[h].card)},2200);
  }
  if(RM){intro.remove();document.body.classList.remove('pre');done=1}
  else{setTimeout(finish,4200);document.getElementById('skip').onclick=finish;intro.addEventListener('click',finish)}
})();
</script>
